name: Verify platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fsrp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fsrp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsrp -d fsrp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fsrp:ci-only-password@localhost:5432/fsrp
      TEST_DATABASE_URL: postgresql://fsrp:ci-only-password@localhost:5432/fsrp_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-state-signing-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
