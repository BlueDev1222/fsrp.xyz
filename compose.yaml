services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fsrp
      POSTGRES_USER: fsrp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsrp -d fsrp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  bot:
    build: .
    command: ["npm", "run", "bot"]
    env_file: .env
    profiles: [discord]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
